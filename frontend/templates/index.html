<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI ChatBot</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f4f4;
}

.wrapper{
    display:flex;
    height:100vh;
}

/* SIDEBAR */

.sidebar{
    width:25%;
    background:#1f1f2e;
    color:white;
    padding:15px;
    overflow-y:auto;
}

.sidebar h2{
    text-align:center;
    margin:20px 0;
}

.new-chat{
    width:100%;
    padding:12px;
    background:#28a745;
    border:none;
    color:white;
    font-size:18px;
    border-radius:6px;
    cursor:pointer;
    margin-bottom:20px;
}

.new-chat:hover{
    background:#218838;
}

.history-item{
    padding:14px;
    margin-bottom:10px;
    background:#2e2e44;
    border-radius:6px;
    cursor:pointer;
    transition:0.3s;
}

.history-item:hover{
    background:#444466;
}

.active-chat{
    background:#007bff;
}

/* CHAT AREA */

.chat-area{
    width:75%;
    display:flex;
    flex-direction:column;
}

.header{
    background:#007bff;
    color:white;
    text-align:center;
    padding:18px;
    font-size:22px;
    font-weight:bold;
}

/* CHAT BOX */

#chat-box{
    flex:1;
    padding:20px;
    overflow-y:auto;
    background:#f5f5f5;
    display:flex;
    flex-direction:column;
}

/* MESSAGE */

.message{
    padding:12px 16px;
    margin-bottom:12px;
    border-radius:12px;
    max-width:70%;
    line-height:1.4;
    word-wrap:break-word;
    font-size:16px;
}

/* USER */

.user{
    background:#d1e7ff;
    align-self:flex-end;
    text-align:left;
}

/* BOT */

.assistant{
    background:#d4edda;
    align-self:flex-start;
    text-align:left;
}

/* LABEL */

.message strong{
    display:block;
    margin-bottom:5px;
}

/* TYPING */

.typing{
    color:gray;
    font-style:italic;
    margin-bottom:15px;
}

/* INPUT */

.input-box{
    display:flex;
    padding:12px;
    background:white;
    border-top:1px solid #ccc;
}

input{
    flex:1;
    padding:12px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:4px;
    outline:none;
}

button{
    padding:12px 20px;
    margin-left:10px;
    background:#007bff;
    border:none;
    color:white;
    font-size:16px;
    border-radius:4px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

</style>
</head>

<body>

<div class="wrapper">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <button class="new-chat" onclick="startNewChat()">
            + New Chat
        </button>

        <h2>Chat History</h2>

        <div id="history"></div>

    </div>

    <!-- CHAT AREA -->

    <div class="chat-area">

        <div class="header">
            AI ChatBot
        </div>

        <div id="chat-box"></div>

        <div class="input-box">

            <input
                type="text"
                id="question"
                placeholder="Ask something..."
            >

            <button onclick="sendMessage()">
                Send
            </button>

        </div>

    </div>

</div>

<script>

/* STORAGE */

let sessions = {};

let currentSession = null;

/* ENTER KEY */

document
.getElementById("question")
.addEventListener("keypress", function(e){

    if(e.key === "Enter"){
        sendMessage();
    }

});

/* NEW CHAT */

function startNewChat(){

    currentSession = null;

    document.getElementById("chat-box").innerHTML = "";

}

/* CREATE SESSION */

function createSession(question){

    let id = "chat_" + Date.now();

    sessions[id] = {

        title: question.substring(0,30),

        messages: []

    };

    currentSession = id;

    renderHistory();

}

/* RENDER HISTORY */

function renderHistory(){

    let historyDiv =
        document.getElementById("history");

    historyDiv.innerHTML = "";

    let ids =
        Object.keys(sessions).reverse();

    ids.forEach(id => {

        let item =
            document.createElement("div");

        item.className = "history-item";

        if(id === currentSession){
            item.classList.add("active-chat");
        }

        item.innerText = sessions[id].title;

        item.onclick = function(){

            loadSession(id);

        };

        historyDiv.appendChild(item);

    });

}

/* LOAD SESSION */

function loadSession(id){

    currentSession = id;

    let chatBox =
        document.getElementById("chat-box");

    chatBox.innerHTML = "";

    sessions[id].messages.forEach(msg => {

        chatBox.appendChild(

            createMessage(
                msg.role,
                msg.content
            )

        );

    });

    renderHistory();

}

/* CREATE MESSAGE */

function createMessage(role, text){

    let div = document.createElement("div");

    div.className = "message " + role;

    /* MARKDOWN BOLD */

    text = text
        .replace(/\*\*(.*?)\*\*/g, "<b>$1</b>")
        .replace(/\n/g, "<br>");

    div.innerHTML = `
        <strong>
            ${role === "user" ? "You" : "Bot"}
        </strong>
        ${text}
    `;

    return div;

}

/* SEND MESSAGE */

async function sendMessage(){

    let input =
        document.getElementById("question");

    let question =
        input.value.trim();

    if(!question) return;

    let chatBox =
        document.getElementById("chat-box");

    /* CREATE NEW SESSION */

    if(currentSession === null){

        createSession(question);

    }

    /* STORE USER MESSAGE */

    sessions[currentSession].messages.push({

        role:"user",

        content:question

    });

    /* SHOW USER MESSAGE */

    chatBox.appendChild(

        createMessage(
            "user",
            question
        )

    );

    input.value = "";

    /* TYPING */

    let typing =
        document.createElement("div");

    typing.className = "typing";

    typing.id = "typing";

    typing.innerText = "Bot is typing...";

    chatBox.appendChild(typing);

    chatBox.scrollTop =
        chatBox.scrollHeight;

    try{

        let response = await fetch(
            "http://127.0.0.1:8000/chat",
            {

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    question:question
                })

            }
        );

        let data =
            await response.json();

        document
            .getElementById("typing")
            .remove();

        let botReply =
            data.response || "No response";

        /* STORE BOT MESSAGE */

        sessions[currentSession].messages.push({

            role:"assistant",

            content:botReply

        });

        /* SHOW BOT MESSAGE */

        chatBox.appendChild(

            createMessage(
                "assistant",
                botReply
            )

        );

    }
    catch(err){

        document
            .getElementById("typing")
            .remove();

        let errorMsg =
            "Backend not reachable";

        sessions[currentSession].messages.push({

            role:"assistant",

            content:errorMsg

        });

        chatBox.appendChild(

            createMessage(
                "assistant",
                errorMsg
            )

        );

    }

    /* AUTO SCROLL */

    chatBox.scrollTop =
        chatBox.scrollHeight;

    /* REFRESH HISTORY */

    renderHistory();

}

</script>

</body>
</html>
